name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: for f in src/*.js src/engine/*.js tools/*.js src/renderer/app.js src/renderer/editor.js; do node --check "$f"; done
      - name: Engine tests (tiny synthetic brain, no download)
        run: npm test
