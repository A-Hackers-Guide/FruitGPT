name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node --check src/main.js && node --check src/engine/worker.js && node --check src/renderer/app.js
      - name: Engine tests (tiny synthetic brain, no download)
        run: npm test
